name: Create Release

on:
  pull_request:
    types:
      - closed
    branches:
      - main

jobs:
  create-release-tag:
    permissions:
      id-token: write
      contents: read
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.merged && contains(github.event.pull_request.labels.*.name, 'release-version') }}
    runs-on: ubuntu-latest
    steps:
      - uses: profiidev/gluon@d715c4a8bd804db764307ad041e73c1c60ec7382 # v0
        id: app-token
        with:
          url: https://gluon.profidev.io
          profile: pr-automation
      - name: Checkout code
        with:
          token: ${{ steps.app-token.outputs.token }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Create tag
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          VERSION=$HEAD_REF
          VERSION=${VERSION#chore/release-version-}
          echo "Creating tag for version $VERSION"
          git tag "$VERSION"
          git push origin "$VERSION"

      - name: Update latest tag
        run: |
          git tag -f latest
          git push origin -f latest

      - name: Update major tag
        run: |
          VERSION=${{ github.event.pull_request.head.ref }}
          VERSION=${VERSION#chore/release-version-}
          MAJOR_VERSION=$(echo $VERSION | cut -d. -f1)
          git tag -f "$MAJOR_VERSION"
          git push origin -f "$MAJOR_VERSION"
