name: 'Cli Build and Release'

on:
  push:
    tags:
      - "v*.*.*"
    branches:
      - main
  pull_request:

jobs:
  build-artifacts:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        name:
          - linux-x86-64-gnu
          - linux-arm64-gnu
          - macos-x86-64
          - macos-arm64
        include:
          - name: linux-x86-64-gnu
            target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - name: linux-arm64-gnu
            target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - name: macos-x86-64
            target: x86_64-apple-darwin
            os: macos-latest
          - name: macos-arm64
            target: aarch64-apple-darwin
            os: macos-latest
    name: Build Cli for ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Cache cargo and rust files
        id: rust_cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          cache-on-failure: true
          shared-key: 'cli_release_cache-${{ matrix.name }}'
      - name: install Rust stable
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          target: ${{ matrix.target }}
          toolchain: stable
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p hibernation
      - name: Compress artifact
        run: tar -czvf hibernation-${{ matrix.name }}.tar.gz -C target/${{ matrix.target }}/release hibernation
      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ github.event_name == 'push' }}
        with:
          name: hibernation-${{ matrix.name }}
          path: hibernation-${{ matrix.name }}.tar.gz

  release-artifacts:
    needs: build-artifacts
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        id: app-token
        with:
          client-id: ${{ secrets.COMMIT_BOT_CLIENT_ID }}
          private-key: ${{ secrets.COMMIT_BOT_PRIVATE_KEY }}
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: hibernation-*
          merge-multiple: true
          path: ./release-assets
      - name: Upload release assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: ./release-assets/*
          tag_name: ${{ github.ref_name }}
          token: ${{ steps.app-token.outputs.token }}
          name: Hibernation ${{ github.ref_name }}
          body: |
            Hibernation version ${{ github.ref_name }} has been released!
          generate_release_notes: true
